[build-system]
requires = ["uv-build>=0.2"]
build-backend = "uv_build"

[project]
name = "image_recognition"
version = "0.1.0"
description = "Live AI demo: classification, detection, segmentation, and style transfer"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "torchvision",
    "opencv-python",
    "pillow",
    "numpy",
    "fiftyone",
    "pycocotools",
    "tqdm",
    "ultralytics>=8.4.10",
]


[tool.setuptools]
package-dir = { "" = "src" }

[tools.setuptools.package.find]
where = ["src"]
