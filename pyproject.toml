[build-system]
requires = ["uv-build>=0.2"]
build-backend = "uv_build"

[project]
name = "image_recognition"
version = "0.1.0"
description = "Live AI demo: classification, detection, segmentation, and style transfer"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "opencv-python==4.9.0.80",
    "pillow==10.3.0",
    "numpy==1.26.4",
    "fiftyone>=1.11.1",
    "pycocotools>=2.0.11",
    "tqdm>=4.67.2",
]


[tool.setuptools]
package-dir = { "" = "src" }

[tools.setuptools.package.find]
where = ["src"]
